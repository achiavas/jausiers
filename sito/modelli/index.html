<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jausiers</title>
<!-- Pagina generata da strumenti/genera_pagine.py a partire da modelli/index.html: modifica il modello, non questa copia. -->
<script>window.LANG_FISSA = "{{LANG}}";</script>
<script src="../comune/i18n.js"></script>
<script>
  document.title = T.titoloPagina;
  // Gestore errori globale: se qualcosa fallisce durante il caricamento
  // (script bloccato, WebGL non disponibile, ecc.) mostra l'errore reale
  // al posto di restare bloccati in silenzio su "Caricamento...".
  window.addEventListener("error", function (e) {
    var el = document.getElementById("loading");
    if (!el) return;
    var msg = (e && (e.message || (e.error && e.error.message))) || String(e);
    el.style.flexDirection = "column";
    el.style.padding = "24px";
    el.style.textAlign = "center";
    el.innerHTML =
      '<div style="font-size:15px;margin-bottom:10px;">' + T.errore + '</div>' +
      '<div style="color:#ff8f8f;font-family:monospace;font-size:12px;max-width:640px;word-break:break-word;">' +
      msg.replace(/</g, "&lt;") + "</div>" +
      '<div style="margin-top:14px;font-size:11px;color:#8892a0;">' + T.console + '</div>';
  });
  // Se dopo 8 secondi il caricamento non e' terminato (nessun errore
  // esplicito ma nemmeno successo), mostra un avviso invece di restare
  // bloccati su uno schermo vuoto senza spiegazioni.
  window.__loadWatchdog = setTimeout(function () {
    var el = document.getElementById("loading");
    if (el && el.textContent.indexOf(T.caricamento) === 0) {
      el.style.flexDirection = "column";
      el.style.padding = "24px";
      el.style.textAlign = "center";
      el.innerHTML =
        '<div style="font-size:15px;margin-bottom:10px;">' + T.lento + '</div>' +
        '<div style="font-size:12px;color:#c8c8ce;max-width:520px;">' + T.lentoCause + '</div>' +
        '<div style="margin-top:14px;font-size:11px;color:#8892a0;">' + T.lentoConsole + '</div>';
    }
  }, 8000);
</script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: #0d1117; }
  #app { display: flex; width: 100vw; height: 100vh; }
  #sidebar { width: 340px; min-width: 340px; height: 100%; background: #161b22;
    color: #e8e8ec; box-sizing: border-box; padding: 18px 16px; overflow-y: auto; }
  #scene-container { flex: 1; height: 100%; position: relative; background: #0d1117; }
  #scene-container canvas { display: block; touch-action: none; }

  /* sezioni a scorrimento del menu */
  details.sez { border-top: 1px solid #2a2f3a; padding: 2px 0 10px 0; }
  details.sez:last-of-type { border-bottom: 1px solid #2a2f3a; }
  details.sez > summary { list-style: none; cursor: pointer; user-select: none; padding: 11px 0 9px 0;
    font-size: 13px; font-weight: 600; color: #f2f2f4; display: flex; align-items: center; gap: 8px; }
  details.sez > summary::-webkit-details-marker { display: none; }
  details.sez > summary::before { content: "\25B8"; color: #f2a154; font-size: 12px; transition: transform .15s; }
  details.sez[open] > summary::before { transform: rotate(90deg); }
  details.sez > summary:hover { color: #f2a154; }
  details.sez:not([open]) { padding-bottom: 2px; }
  /* Viste: sempre aperta */
  .sez-fissa { border-top: 1px solid #2a2f3a; padding: 2px 0 10px 0; }
  .sez-fissa > .tit-sez { padding: 11px 0 9px 0; font-size: 13px; font-weight: 600; color: #f2f2f4; }
  .nota-sez { font-size: 12px; color: #c8ccd4; line-height: 1.5; }
  details.sez .lbl:first-of-type { margin-top: 2px; }
  #sidebar h1 { font-size: 15px; font-weight: 600; margin: 0 0 14px 0; line-height: 1.3; color: #f2f2f4; }
  .lbl { font-size: 11px; color: #8892a0; text-transform: uppercase; letter-spacing: .03em; margin: 14px 0 2px 0; }
  .big-date { font-size: 25px; font-weight: 600; color: #e8e8ec; margin: 2px 0 6px 0; }
  .big-time { font-size: 29px; font-weight: 600; color: #f2a154; margin: 2px 0 6px 0; }
  input[type=range] { width: 100%; accent-color: #f2a154; }

  #sun-info { font-size: 13px; color: #e8e8ec; margin-top: 14px; line-height: 1.5; white-space: pre-line; }
  #lit-list { font-size: 11px; color: #e8e8ec; margin-top: 10px; line-height: 1.6; white-space: pre-line; }

  .photo-toggle-row { display: flex; align-items: center; gap: 8px; margin-top: 16px; cursor: pointer; user-select: none; }
  .photo-toggle-row input { width: 18px; height: 18px; accent-color: #f2a154; cursor: pointer; }
  .photo-toggle-row span { font-size: 13px; color: #e8e8ec; }

  #viste-interne { display: flex; gap: 8px; margin-top: 4px; }
  #viste-interne .col { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  #viste-interne .tit { font-size: 11px; color: #8892a0; }
  .viste-riga { display: flex; gap: 8px; margin-top: 6px; }
  .vbtn { flex: 1; background: #0d1117; color: #e8e8ec; border: 1px solid #2a2f3a; border-radius: 6px;
    padding: 6px 4px; font-size: 12px; cursor: pointer; }
  .vbtn:hover { border-color: #f2a154; }
  .vbtn.attivo { border-color: #f2a154; color: #f2a154; }
  .legend { margin-top: 16px; font-size: 12px; line-height: 1.8; }

  .link a { color: #f2a154; text-decoration: none; }
  #fonteSelect { width: 100%; margin-top: 4px; background: #0d1117; color: #e8e8ec; border: 1px solid #2a2f3a; border-radius: 6px; padding: 5px; font-size: 13px; }
  #orient-info { font-size: 12px; color: #e8e8ec; margin-top: 6px; line-height: 1.55; white-space: pre-line; }
  .nota { font-size: 10px; color: #8892a0; margin-top: 4px; line-height: 1.4; }
  #giorno-luce { font-size: 11px; color: #e8e8ec; margin-top: 4px; line-height: 1.55; }
  #giorno-luce .t { color: #f2a154; font-variant-numeric: tabular-nums; }
  .link { margin-top: 18px; font-size: 13px; }
  #hints { margin-top: 16px; font-size: 10px; color: #8892a0; line-height: 1.6; white-space: pre-line; }

  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #8892a0; font-size: 14px; background: #0d1117; z-index: 5; }

  #menuToggle { display: none; position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; z-index: 20;
    width: 44px; height: 44px; border-radius: 8px; background: #161b22e6; border: 1px solid #2a2f3a;
    color: #e8e8ec; font-size: 20px; align-items: center; justify-content: center; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; }
  #sidebarBackdrop { display: none; }

  /* Croce di frecce per camminare: sempre visibile (sul computer anche le frecce della tastiera) */
  #frecce { display: block; position: absolute; right: 14px; bottom: max(14px, env(safe-area-inset-bottom));
    z-index: 6; width: 210px; height: 150px; touch-action: none; user-select: none; -webkit-user-select: none; }
  #frecce button { position: absolute; width: 50px; height: 50px; border-radius: 10px; border: 1px solid #2a2f3a;
    background: #161b22b3; color: #e8e8ec; font-size: 20px; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #frecce button.premuto { background: #f2a154cc; color: #161b22; }
  #frecce .su { left: 110px; top: 0; } #frecce .giu { left: 110px; top: 100px; }
  #frecce .sx { left: 60px; top: 50px; } #frecce .dx { left: 160px; top: 50px; }
  #frecce .alto { left: 0; top: 0; } #frecce .basso { left: 0; top: 100px; }
  #frecce .alto, #frecce .basso { font-size: 13px; font-weight: 600; }
  @media (pointer: coarse) { #frecce { display: block; } }

  /* Schermi stretti (telefoni/tablet in verticale): il pannello
     laterale diventa un cassetto a comparsa sopra la scena 3D, che
     resta sempre a schermo intero, invece di dividersi lo spazio. */
  @media (max-width: 760px) {
    #app { position: relative; }
    #menuToggle { display: flex; }
    #sidebar { position: fixed; top: 0; left: 0; z-index: 11; width: 86vw; max-width: 340px;
      height: 100vh; height: 100dvh;  /* le barre del browser del telefono non coprono il fondo del menu */
      padding-top: 64px; padding-bottom: calc(24px + env(safe-area-inset-bottom));
      overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
      transform: translateX(-100%); transition: transform .25s ease; box-shadow: 4px 0 20px rgba(0,0,0,.5); }
    #frecce { display: block; }
    #sidebar.open { transform: translateX(0); }
    /* sul telefono: menu piu' stretto (resta scena da toccare per chiuderlo),
       viste in cima, cursori con la maniglia grande per il dito */
    #sidebar { width: 80vw; display: flex; flex-direction: column; }
    #blocco-viste .vbtn { min-height: 40px; }
    details.sez > summary, .sez-fissa > .tit-sez { padding: 14px 0 12px 0; font-size: 14px; }
    #sidebar input[type=range] { height: 34px; -webkit-appearance: none; appearance: none; background: transparent; }
    #sidebar input[type=range]::-webkit-slider-runnable-track { height: 6px; background: #3a3f4a; border-radius: 3px; }
    #sidebar input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px;
      border-radius: 50%; background: #f2a154; border: 2px solid #161b22; }
    #sidebar input[type=range]::-moz-range-track { height: 6px; background: #3a3f4a; border-radius: 3px; }
    #sidebar input[type=range]::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: #f2a154; border: 2px solid #161b22; }
    #sidebar select { min-height: 40px; }
    #sidebarBackdrop.open { display: block; position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.45); }
    #scene-container { width: 100vw; }
    #hints { display: none; } /* i comandi da tastiera non servono su touch */
  }
</style>
</head>
<body>
<div id="app">
  <div id="menuToggle">&#9776;</div>
  <div id="sidebarBackdrop"></div>
  <div id="sidebar">
    <h1>JAUSIERS<br><span id="nomeChiesa"></span></h1>

    <!-- menu a scorrimento: ogni sezione si apre e si chiude con un clic -->
    <details class="sez" id="sez-storia">
      <summary id="sezStoria"></summary>
      <div class="nota-sez" id="testoStoria"></div>
      <div class="link"><a id="linkStoria" href="storia.html"></a></div>
    </details>

    <details class="sez" id="sez-orientamento">
      <summary id="sezOrientamento"></summary>
      <select id="fonteSelect"></select>
      <div id="orient-info"></div>
      <div class="nota" id="notaOrientamento"></div>
    </details>

    <details class="sez" id="sez-data" open>
      <summary id="sezData"></summary>
      <div class="lbl" id="lblGiorno"></div>
      <div class="big-date" id="bigDate">21</div>
      <input type="range" id="daySlider" min="1" max="365" value="172">
      <div class="lbl" id="lblOra"></div>
      <div class="big-time" id="bigTime">12:00</div>
      <input type="range" id="hourSlider" min="0" max="23.983" step="0.05" value="12">
      <div id="sun-info"></div>
    </details>

    <details class="sez" id="sez-vetrate">
      <summary id="sezVetrate"></summary>
      <div id="lit-list"></div>
      <div class="lbl" id="lblLuceGiorno"></div>
      <div id="giorno-luce"></div>
      <div class="legend">
        <div style="color:#f2a154">&#9632; <span id="legCappelle"></span></div>
        <div style="color:#d1495b">&#9632; <span id="legAbside"></span></div>
        <div style="color:#3a86ff">&#9632; <span id="legFacciata"></span></div>
      </div>
    </details>

    <div class="sez sez-fissa" id="blocco-viste">
      <div class="tit-sez" id="lblVistaInterna"></div>
      <div id="viste-interne">
        <div class="col"><div class="tit" id="titSinistra"></div></div>
        <div class="col"><div class="tit" id="titDestra"></div></div>
      </div>
      <div class="viste-riga">
        <button class="vbtn" id="btnFacciata"></button>
        <button class="vbtn" id="btnAbside"></button>
        <button class="vbtn" id="btnEsterno"></button>
      </div>
      <div class="viste-riga">
        <button class="vbtn" id="btnFacciataEsterna"></button>
      </div>
      <div class="nota" id="notaViste"></div>
    </div>

    <details class="sez" id="sez-mostra">
      <summary id="sezMostra"></summary>
      <div style="display:flex; gap:24px;">
        <label class="photo-toggle-row">
          <input type="checkbox" id="photosCheckbox" checked>
          <span id="txtFoto"></span>
        </label>
        <label class="photo-toggle-row">
          <input type="checkbox" id="windowsCheckbox" checked>
          <span id="txtVetrate"></span>
        </label>
      </div>
    </details>

    <div id="hints"></div>
  </div>
  <div id="scene-container">
    <div id="frecce">
      <button class="su" data-tasto="ArrowUp">&#9650;</button>
      <button class="sx" data-tasto="ArrowLeft">&#9664;</button>
      <button class="dx" data-tasto="ArrowRight">&#9654;</button>
      <button class="giu" data-tasto="ArrowDown">&#9660;</button>
      <button class="alto" data-tasto="PageUp"></button>
      <button class="basso" data-tasto="PageDown"></button>
    </div>
    <div id="loading"></div>
    <script>document.getElementById("loading").textContent = T.caricamento;</script>
  </div>
</div>

<!-- Librerie (build classiche, NON moduli ES: i moduli ES vengono
     bloccati da Chrome/Edge per CORS quando la pagina e' aperta con
     doppio click invece che via un server - vedi README) -->
<script src="../comune/three.min.js"></script>
<script src="../comune/orbit-controls-lite.js"></script>
<script src="../comune/photos-data.js"></script>

<!-- Logica applicativa (porting di church_geometry.py, church_mesh.py,
     solar_position.py, wall_projection.py, reference_photos.py) -->
<!-- Dati generati da strumenti/genera_dati.py (ricerca /chiesa, chiese.py) -->
<script src="../comune/dati/ricerca.js"></script>
<script src="../comune/dati/chiese_ubaye.js"></script>
<script src="../comune/parametri.js"></script>

<script src="../comune/triangulate.js"></script>
<script src="../comune/church-geometry.js"></script>
<script src="../comune/church-mesh.js"></script>
<script src="../comune/solar-position.js"></script>
<script src="../comune/wall-projection.js"></script>
<script src="../comune/paris-time.js"></script>
<script src="../comune/reference-photos.js"></script>

<script>
"use strict";

// Testi statici nella lingua scelta
for (const [id, testo] of Object.entries({
  sezStoria: T.sezStoria, testoStoria: T.testoStoria, sezOrientamento: T.sezOrientamento, sezData: T.sezData,
  sezVetrate: T.sezVetrate, sezMostra: T.sezMostra, lblGiorno: T.giorno, lblOra: T.ora, lblLuceGiorno: T.luceGiorno,
  txtFoto: T.mostraFoto, txtVetrate: T.mostraVetrate, legCappelle: T.cappelle, legAbside: T.abside,
  legFacciata: T.facciata, linkStoria: T.apriStoria, hints: T.tasti, notaOrientamento: T.nota,
  lblVistaInterna: T.vistaInterna, titSinistra: T.vistaSinistra, titDestra: T.vistaDestra,
  btnFacciata: T.vistaFacciata, btnAbside: T.vistaAbside, btnEsterno: T.vistaEsterno, btnFacciataEsterna: T.vistaFacciataEsterna, notaViste: T.vistaNota,
})) document.getElementById(id).textContent = testo;
document.getElementById("nomeChiesa").textContent = T.nomeChiesa;
const GROUP_COLORS = { cappella: 0xf2a154, abside: 0xd1495b, facciata: 0x3a86ff, porta: 0xcfc7b0 };
const WALL_OPACITY = 0.28;
const YEAR = 2026;

// -----------------------------------------------------------------
// Modello geometrico + mesh
// -----------------------------------------------------------------
const church = defaultChurch();
const meshData = buildAll(church, WALL_HEIGHT_M);

function partToGeometry(part) {
  const geom = new THREE.BufferGeometry();
  const pos = new Float32Array(part.positions.length * 3);
  part.positions.forEach((p, i) => { pos[i * 3] = p[0]; pos[i * 3 + 1] = p[1]; pos[i * 3 + 2] = p[2]; });
  geom.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const idx = new Uint32Array(part.indices.length * 3);
  part.indices.forEach((t, i) => { idx[i * 3] = t[0]; idx[i * 3 + 1] = t[1]; idx[i * 3 + 2] = t[2]; });
  geom.setIndex(new THREE.BufferAttribute(idx, 1));
  geom.computeVertexNormals();
  return geom;
}

// -----------------------------------------------------------------
// Scena Three.js
// -----------------------------------------------------------------
const container = document.getElementById("scene-container");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 500);
camera.up.set(0, 0, 1);

const renderer = (() => {
  if (typeof THREE === "undefined") {
    throw new Error("La libreria Three.js non si e' caricata (three.min.js). Verifica che il file sia nella stessa cartella di index.html.");
  }
  const canvasTest = document.createElement("canvas");
  const gl = canvasTest.getContext("webgl2") || canvasTest.getContext("webgl") || canvasTest.getContext("experimental-webgl");
  if (!gl) {
    throw new Error("WebGL non e' disponibile in questo browser/scheda grafica. Prova ad aggiornare il browser, aggiornare i driver video, oppure verificare che l'accelerazione hardware sia attiva nelle impostazioni del browser.");
  }
  const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
  return new THREE.WebGLRenderer({ antialias: !isTouch, powerPreference: "low-power" });
})();
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
container.appendChild(renderer.domElement);

const controls = new OrbitControlsLite(camera, renderer.domElement);

function resize() {
  const w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener("resize", resize);

scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const sunLight = new THREE.DirectionalLight(0xfff2d9, 1.0);
scene.add(sunLight);
scene.add(sunLight.target);
// ombre degli oggetti interni (vedi PRIMO_ARREDO): la camera d'ombra copre tutta la chiesa
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// gli oggetti che fanno ombra sono fermi: la mappa d'ombra si ridisegna solo
// quando si sposta il sole (updateScene), non a ogni fotogramma
renderer.shadowMap.autoUpdate = false;
sunLight.castShadow = true;
// sul telefono una mappa piu' piccola (2.5 cm per pixel): meno memoria e meno lavoro
const SCHERMO_TOUCH = window.matchMedia("(pointer: coarse)").matches;
sunLight.shadow.mapSize.set(SCHERMO_TOUCH ? 2048 : 4096, SCHERMO_TOUCH ? 2048 : 4096);
Object.assign(sunLight.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 160 });
sunLight.shadow.bias = -0.0004;
sunLight.shadow.normalBias = 0.03;

const floorMat = new THREE.MeshStandardMaterial({ color: 0xf1e9d8, side: THREE.DoubleSide });
const wallMat = new THREE.MeshStandardMaterial({ color: 0xcfc7b0, transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false });
const roofMat = new THREE.MeshStandardMaterial({ color: 0x6b4a3a, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false });
const chapelWallMat = new THREE.MeshStandardMaterial({ color: 0xc8bda3, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false });
const chapelPierMat = new THREE.MeshStandardMaterial({ color: 0xcfc7b0, transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false });
const apseStructureMat = new THREE.MeshStandardMaterial({ color: 0x6b4a3a, transparent: true, opacity: 0.4, side: THREE.DoubleSide, depthWrite: false });
const towerMat = new THREE.MeshStandardMaterial({ color: 0xa89a82, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false });
const narthexMat = new THREE.MeshStandardMaterial({ color: 0x4a4038, transparent: true, opacity: 0.75, side: THREE.DoubleSide });

const floorMesh = new THREE.Mesh(partToGeometry(meshData.floor), floorMat);
// Pavimento vero (texture da IMG_9757, pavimento_da_video.py): coordinate
// texture dalle coordinate locali (u lungo la navata, si ripete ogni
// PAVIMENTO_PERIODO_M; v di traverso, corridoio al centro).
if (PHOTO_DATA[PAVIMENTO_FILENAME]) {
  const g = floorMesh.geometry, p = g.attributes.position.array, uv = new Float32Array(p.length / 3 * 2);
  const Uh = church.localToEnu(1, 0, 0), Vh = church.localToEnu(0, 1, 0);
  for (let i = 0; i < p.length / 3; i++) {
    const x = p[i * 3], y = p[i * 3 + 1], z = p[i * 3 + 2];
    uv[i * 2] = (x * Vh[0] + y * Vh[1]) / PAVIMENTO_LARGHEZZA_M + 0.5;   // di traverso (colonne dell'immagine)
    // lungo la navata (si ripete); + z: le alzate dei gradini prendono la pietra invece di strisce
    uv[i * 2 + 1] = (x * Uh[0] + y * Uh[1] + z) / PAVIMENTO_PERIODO_M;
  }
  g.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  const tex = new THREE.TextureLoader().load(PHOTO_DATA[PAVIMENTO_FILENAME]);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.ClampToEdgeWrapping; tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  floorMat.map = tex; floorMat.color.setHex(0xffffff);
  // un po' di luce propria: dentro la chiesa il sole arriva solo dalle vetrate
  floorMat.emissive.setHex(0x8a8a8a); floorMat.emissiveMap = tex;
  floorMat.needsUpdate = true;
}
const wallsMesh = new THREE.Mesh(partToGeometry(meshData.walls), wallMat);
wallsMesh.renderOrder = 1;
const roofMesh = new THREE.Mesh(partToGeometry(meshData.roof), roofMat);
roofMesh.renderOrder = 1;

function orientaVersoFuori(geom, centro) {
  const p = geom.attributes.position.array, idx = geom.index.array;
  const P = (i) => new THREE.Vector3(p[i * 3], p[i * 3 + 1], p[i * 3 + 2]);
  for (let t = 0; t < idx.length; t += 3) {
    const a = P(idx[t]), b = P(idx[t + 1]), c = P(idx[t + 2]);
    const n = new THREE.Vector3().subVectors(b, a).cross(new THREE.Vector3().subVectors(c, a));
    const m = a.clone().add(b).add(c).multiplyScalar(1 / 3);
    const u = m.x * U_[0] + m.y * U_[1], v = m.x * V_[0] + m.y * V_[1];
    const r = new THREE.Vector3(...church.localToEnu(...centro(u, v)));

// Tetto e muri esterni tappezzati (texture da IMG_9765, tetto_muri_da_video.py):
// per ogni faccia coordinate texture in metri sul suo piano (orizzontale
// lungo la faccia, in su lungo il muro o lungo la falda), divise per la
// misura di una ripetizione. Facce inclinate (|nz| > 0.35) = falde: scandole;
// le altre: intonaco. Stessa regola del viewer Python (tappezza).
const OPACITA_ESTERNA = 0.75, OPACITA_TETTO = 0.9;
function texRipetuta(nome) {
  if (!PHOTO_DATA[nome]) return null;
  const t = new THREE.TextureLoader().load(PHOTO_DATA[nome]);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  return t;
}
const TEX_MURO = texRipetuta(MURO_TEXTURE_FILENAME), TEX_TETTO = texRipetuta(TETTO_TEXTURE_FILENAME);
// Spazio interno di navata e abside: dentro la pianta e sotto il muro. Una faccia il cui
// fronte guarda qui dentro non prende texture (la texture solo da fuori).
const PIANTA_ = church.floorOutlineLocal().slice(0, -1);
function dentroLaChiesa(q) {
  const u = q.x * U_[0] + q.y * U_[1], v = q.x * V_[0] + q.y * V_[1];
  let dentro = false;
  for (let i = 0, j = PIANTA_.length - 1; i < PIANTA_.length; j = i++) {
    const [ui, vi] = PIANTA_[i], [uj, vj] = PIANTA_[j];
    if ((vi > v) !== (vj > v) && u < (uj - ui) * (v - vi) / (vj - vi + 1e-12) + ui) dentro = !dentro;
  }
  // solo navata e abside: le facce delle cappelle sono gia' orientate verso
  // fuori dalla nicchia (e il muro della navata dietro le cappelle e' una
  // faccia unica, che fuori dalle cappelle e' esterna)
  const alto = u > NAVE_LENGTH_M ? APSE_EXTERNAL_HEIGHT_M : WALL_HEIGHT_M;
  return dentro && Math.abs(v) < WH_ && q.z > 0 && q.z < alto;
}
function tappezza(mesh, opacitaMuro, retro) {
  if (!TEX_MURO || !TEX_TETTO) return;
  const g0 = mesh.geometry.index ? mesh.geometry.toNonIndexed() : mesh.geometry;
  const p = g0.attributes.position.array, nt = p.length / 9;
  const muri = [], falde = [], interne = [];
  const V = (t, k) => new THREE.Vector3(p[t * 9 + k * 3], p[t * 9 + k * 3 + 1], p[t * 9 + k * 3 + 2]);
  const normale = (t) => new THREE.Vector3().subVectors(V(t, 1), V(t, 0)).cross(new THREE.Vector3().subVectors(V(t, 2), V(t, 0))).normalize();
  for (let t = 0; t < nt; t++) {
    const n = normale(t);
    const c = V(t, 0).add(V(t, 1)).add(V(t, 2)).multiplyScalar(1 / 3);
    // facciata esterna (faccia verso -u, sul filo della facciata): niente
    // intonaco ne' muro, la copre la foto della facciata
    const facciata = n.x * U_[0] + n.y * U_[1] < -0.9 && c.x * U_[0] + c.y * U_[1] < 0.8;
    const prova = c.clone().addScaledVector(n, 0.3);
    (facciata || dentroLaChiesa(prova) ? interne : Math.abs(n.z) > 0.35 ? falde : muri).push(t);
  }
  const pos = new Float32Array(nt * 9), uv = new Float32Array(nt * 6);
  let k = 0;
  for (const [lista, tw, th] of [[muri, MURO_TEXTURE_M, MURO_TEXTURE_M], [falde, TETTO_TEXTURE_M[0], TETTO_TEXTURE_M[1]], [interne, 1, 1]]) {
    for (const t of lista) {
      const n = normale(t);
      let tg = new THREE.Vector3(0, 0, 1).cross(n);
      if (tg.length() < 1e-3) tg.set(1, 0, 0);
      tg.normalize();
      const b = new THREE.Vector3().crossVectors(n, tg);
      for (let j = 0; j < 3; j++) {
        const q = V(t, j);
        pos.set([q.x, q.y, q.z], k * 3);
        uv.set([q.dot(tg) / tw, q.dot(b) / th], k * 2);
        k++;
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  g.computeVertexNormals();
  g.addGroup(0, muri.length * 3, 0);
  g.addGroup(muri.length * 3, falde.length * 3, 1);
  g.addGroup((muri.length + falde.length) * 3, interne.length * 3, 2);
  const base = mesh.material;
  const muro = base.clone(); muro.map = TEX_MURO; muro.color.setHex(0xffffff); muro.opacity = Math.max(base.opacity, opacitaMuro);
  const tetto = base.clone(); tetto.map = TEX_TETTO; tetto.color.setHex(0xffffff); tetto.opacity = Math.max(base.opacity, OPACITA_TETTO);
  // un po' di luce propria: sul lato in ombra le texture resterebbero nere
  for (const m of [muro, tetto]) { m.emissive.setHex(0x6a6a6a); m.emissiveMap = m.map; }
  if (base.onBeforeCompile) { muro.onBeforeCompile = base.onBeforeCompile; tetto.onBeforeCompile = base.onBeforeCompile; }
  // facce che guardano dentro: bianche come gli interni (muri) o il colore di prima (tetto)
  const interna = base.clone();
  if (retro === undefined) { interna.color.setHex(COLORE_INTERNO); interna.emissive.setHex(0xa8a6a0); interna.opacity = OPACITA_INTERNA; }
  interna.side = THREE.DoubleSide;
  // non si disegnano: le facce delle cappelle che chiudono l'arco verso la
  // navata (farebbero un velo davanti alla nicchia) e la facciata esterna
  // (sopra c'e' la foto della facciata)
  interna.visible = false;
  if (base.onBeforeCompile) interna.onBeforeCompile = base.onBeforeCompile;
  mesh.geometry = g;
  mesh.material = [muro, tetto, interna];
  if (retro !== undefined) {
    // tetto e campanile: da dentro (retro) il colore di prima, senza texture
    muro.side = tetto.side = THREE.FrontSide;
    const m2 = base.clone(); m2.side = THREE.BackSide;
    const gemello = new THREE.Mesh(g, m2); gemello.renderOrder = mesh.renderOrder;
    scene.add(gemello);
  }
}

// Buca il muro della navata negli archi d'ingresso delle cappelle con
// nicchia (il muro semitrasparente davanti alla nicchia la sbiadirebbe):
// lo shader scarta i pixel che cadono dentro l'arco, sulla faccia interna
// ed esterna. Stessa forma di reference_photos.py (fora_archi_cappelle).
// archi aperti solo con la vista dentro la chiesa (vedi aggiornaDentroFuori)
const ARCHI_BUCATI = { value: 1.0 };
function foraArchi(mat) {
  const ucs = NICCHIE.map(([, , i]) => church.chapelUPositions()[i]);
  const lati = NICCHIE.map(([, l]) => l);
  while (ucs.length < 8) { ucs.push(0); lati.push(0); }
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, {
      bucato: ARCHI_BUCATI,
      uHat: { value: new THREE.Vector2(U_[0], U_[1]) }, vHat: { value: new THREE.Vector2(V_[0], V_[1]) },
      wh: { value: WH_ }, spess: { value: 0.7 }, archR: { value: CHAPEL_ARCH_RADIUS_M },
      archS: { value: CHAPEL_ARCH_SPRING_M }, ucs: { value: ucs }, lati: { value: lati },
    });
    sh.vertexShader = sh.vertexShader
      .replace("#include <common>", "#include <common>\nvarying vec3 vMondo;")
      .replace("#include <begin_vertex>", "#include <begin_vertex>\nvMondo = (modelMatrix * vec4(transformed, 1.0)).xyz;");
    sh.fragmentShader = sh.fragmentShader
      .replace("#include <common>", `#include <common>
varying vec3 vMondo;
uniform vec2 uHat; uniform vec2 vHat; uniform float wh; uniform float spess;
uniform float archR; uniform float archS; uniform float ucs[8]; uniform float lati[8]; uniform float bucato;`)
      .replace("void main() {", `void main() {
  float uu = dot(vMondo.xy, uHat), vv = dot(vMondo.xy, vHat), ww = vMondo.z;
  if (bucato > 0.5 && abs(vv) > wh - 0.05 && abs(vv) < wh + spess + 0.05) {
    for (int i = 0; i < 8; i++) {
      if (lati[i] * vv <= 0.0) continue;
      float X = uu - ucs[i];
      if (abs(X) < archR && (ww < archS || X * X + (ww - archS) * (ww - archS) < archR * archR)) discard;
    }
  }`);
  };
  mat.needsUpdate = true;
}

const photoGroup = new THREE.Group();

const textureCache = {};
function loadTexture(filename) {
  if (!textureCache[filename]) {
    const dataUri = PHOTO_DATA[filename];
    const tex = new THREE.TextureLoader().load(dataUri);
    tex.colorSpace = THREE.SRGBColorSpace;
    textureCache[filename] = tex;
  }
  return textureCache[filename];
}

function addTexturedMesh(part, opts = {}) {
  const geom = new THREE.BufferGeometry();
  const pos = new Float32Array(part.positions.length * 3);
  part.positions.forEach((p, i) => { pos[i * 3] = p[0]; pos[i * 3 + 1] = p[1]; pos[i * 3 + 2] = p[2]; });
  geom.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const uvArr = new Float32Array(part.uvs.length * 2);
  part.uvs.forEach((uv, i) => { uvArr[i * 2] = uv[0]; uvArr[i * 2 + 1] = uv[1]; });
  geom.setAttribute("uv", new THREE.BufferAttribute(uvArr, 2));
  const idx = new Uint32Array(part.indices.length * 3);
  part.indices.forEach((t, i) => { idx[i * 3] = t[0]; idx[i * 3 + 1] = t[1]; idx[i * 3 + 2] = t[2]; });
  geom.setIndex(new THREE.BufferAttribute(idx, 1));
  geom.computeVertexNormals();

  // soloFronte: angoli in senso antiorario visti dal fronte -> FrontSide
  // mostra la foto solo da quel lato (la facciata esterna non si vede da dentro)
  // PNG con trasparenza (facciata esterna ritagliata): i pixel trasparenti si scartano
  const png = part.filename.toLowerCase().endsWith(".png");
  const mat = new THREE.MeshBasicMaterial({ map: loadTexture(part.filename),
    side: part.soloFronte ? THREE.FrontSide : THREE.DoubleSide, toneMapped: false,
    transparent: png, alphaTest: png ? 0.5 : 0 });
  const mesh = new THREE.Mesh(geom, mat);
  photoGroup.add(mesh);

  if (opts.frameLoop) {
    const pts = opts.frameLoop.map((i) => new THREE.Vector3(...part.positions[i]));
    const lineGeom = new THREE.BufferGeometry().setFromPoints(pts);
    const line = new THREE.Line(lineGeom, new THREE.LineBasicMaterial({ color: 0x2b2b2b }));
    mesh.add(line);  // figlia della foto: si nasconde con lei (coordinate gia' nel mondo)
  }
  return mesh;

// "Dentro" = camera nella pianta della chiesa: navata, nicchie, abside.
function cameraDentro() {
  const p = camera.position;
  const u = p.x * U_[0] + p.y * U_[1], v = p.x * V_[0] + p.y * V_[1];
  if (p.z < 0 || p.z > WALL_HEIGHT_M + 6) return false;
  if (u >= 0 && u <= NAVE_LENGTH_M && Math.abs(v) <= WH_) return true;           // navata
  if (u > NAVE_LENGTH_M && u < NAVE_LENGTH_M + 6 && Math.abs(v) < WH_ - 1.0) return true;  // abside
  return aperturaCappella(church, u, v, Math.min(p.z, CHAPEL_ARCH_SPRING_M), 0)
    && Math.abs(v) <= WH_ + CHAPEL_PROJECTION_DEPTH_M;                             // dentro una nicchia
}

// Macchie di luce (pavimento + pareti), ricostruite ad ogni update
// -----------------------------------------------------------------
let lightPatchMeshes = [];
function clearLightPatches() {
  for (const m of lightPatchMeshes) { scene.remove(m); m.geometry.dispose(); m.material.dispose(); }
  lightPatchMeshes = [];
}

function addLightPatch(pointsWorld, color) {
  const n = pointsWorld.length;
  if (n < 3) return;
  const geom = new THREE.BufferGeometry();
  const pos = new Float32Array(n * 3);
  pointsWorld.forEach((p, i) => { pos[i * 3] = p[0]; pos[i * 3 + 1] = p[1]; pos[i * 3 + 2] = p[2]; });
  geom.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  // normale verso il sole: lo strato d'ombra (normalBias) cerca l'ombra un
  // po' fuori dalla superficie; con la normale rovesciata finirebbe dentro
  // il legno dei banchi e li vedrebbe sempre in ombra
  const a = new THREE.Vector3(...pointsWorld[0]);
  const nrm = new THREE.Vector3();
  for (let i = 1; i < n - 1; i++) {
    const e1 = new THREE.Vector3(...pointsWorld[i]).sub(a), e2 = new THREE.Vector3(...pointsWorld[i + 1]).sub(a);
    nrm.add(e1.cross(e2));
  }
  const versoSole = sunLight.position.clone().sub(sunLight.target.position);
  const giro = nrm.dot(versoSole) < 0;
  const idx = [];
  for (let i = 1; i < n - 1; i++) giro ? idx.push(0, i + 1, i) : idx.push(0, i, i + 1);
  geom.setIndex(idx);
  geom.computeVertexNormals();
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.5, side: THREE.DoubleSide, depthWrite: false, toneMapped: false });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.renderOrder = 3;
  scene.add(mesh);
  lightPatchMeshes.push(mesh);
  // ombra opaca: sopra la macchia uno strato che mostra solo le ombre degli
  // oggetti interni (banchi, altari, pulpito...) dove fermano la luce
  const ombra = new THREE.Mesh(geom, new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.55, side: THREE.DoubleSide,
    depthWrite: false }));
  ombra.receiveShadow = true;
  ombra.renderOrder = 4;
  scene.add(ombra);
  lightPatchMeshes.push(ombra);
}

const state = {
  dayOfYear: Math.min(365, Math.max(1, parseInt(URL_PARAMS.get("giorno"), 10) || 172)),
  hour: Math.min(23.983, Math.max(0, parseFloat(URL_PARAMS.get("ora")) || 12.0)),
  playing: false,
};

function currentDate() {
  return dayOfYearToDate(YEAR, state.dayOfYear);
}

function updateScene() {
  const { year, month, day } = currentDate();
  const dtUTC = parisLocalToUTC(year, month, day, state.hour);
  const sun = solarPosition(dtUTC, LATITUDE_DEG, LONGITUDE_DEG);

  clearLightPatches();
  const litNames = [];

  if (sun.isUp) {
    const azRad = (Math.PI / 180) * sun.azimuthDeg;
    const altRad = (Math.PI / 180) * sun.altitudeDeg;
    const dir = new THREE.Vector3(Math.sin(azRad) * Math.cos(altRad), Math.cos(azRad) * Math.cos(altRad), Math.sin(altRad));
    // luce del sole puntata sul centro della chiesa (serve alla camera d'ombra)
    const centro = new THREE.Vector3(...church.localToEnu(NAVE_LENGTH_M / 2 + 3, 0, 6));
    sunLight.position.copy(centro.clone().add(dir.clone().multiplyScalar(80)));
    sunLight.target.position.copy(centro);
    sunLight.target.updateMatrixWorld();
    renderer.shadowMap.needsUpdate = true;
    sunLight.shadow.camera.updateProjectionMatrix();
    sunLight.intensity = 0.5 + 0.6 * Math.max(0, Math.sin(altRad));

    for (const win of church.windows) {
      if (win.group === "porta") continue; // la porta e' un solido opaco: non lascia passare luce, non cambia mai aspetto
      const mesh = windowMeshes[win.name];
      const patches = projectWindowWithWalls(church, win.localOutline(), win.wallAzimuthDeg, sun, WALL_HEIGHT_M);
      if (patches.length > 0) {
        litNames.push(win.name);
        mesh.material.opacity = 0.85;
        mesh.material.emissiveIntensity = 0.45;
        for (const patch of patches) addLightPatch(patch.pointsWorld, GROUP_COLORS[win.group]);
      } else {
        mesh.material.opacity = 0.4;
        mesh.material.emissiveIntensity = 0.08;
      }
    }
  } else {
    sunLight.intensity = 0.08;
    for (const win of church.windows) {
      if (win.group === "porta") continue;
      const mesh = windowMeshes[win.name];
      mesh.material.opacity = 0.4;
      mesh.material.emissiveIntensity = 0.08;
    }
  }

  updateTexts(year, month, day, sun, litNames);
}

function updateTexts(year, month, day, sun, litNames) {
  let hh = Math.floor(state.hour);
  let mm = Math.round((state.hour - hh) * 60);
  if (mm === 60) { mm = 0; hh = (hh + 1) % 24; }
  document.getElementById("bigDate").textContent = day + " " + T.mesi[month];
  document.getElementById("bigTime").textContent = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");

  const sunInfo = sun.isUp ? T.sole(sun.azimuthDeg.toFixed(1), sun.altitudeDeg.toFixed(1)) : T.soleSotto;
  document.getElementById("sun-info").textContent = sunInfo;

  const litStr = T.illuminate + "\n" + (litNames.length ? litNames.map((n) => "  " + nome(n)).join("\n") : "  " + T.nessuna);
  document.getElementById("lit-list").textContent = litStr;
}

function wallsCenterXY() {
  const box = new THREE.Box3().setFromObject(wallsMesh);
  return box.getCenter(new THREE.Vector3());
}

function centerCamera() {
  const c = wallsCenterXY();
  // schermo in verticale (telefono): piu' lontano, cosi' la chiesa entra tutta
  const k = camera.aspect < 1 ? Math.min(2.4, 1.15 / camera.aspect) : 1;
  camera.position.set(c.x - 30 * k, c.y - 42 * k, WALL_HEIGHT_M * 0.35 * k);
  controls.target.set(c.x, c.y, WALL_HEIGHT_M * 0.2);
}

function viewFrom(compassAzimuthDeg, elevationDeg, distance) {
  elevationDeg = elevationDeg === undefined ? 20 : elevationDeg;
  distance = distance === undefined ? 55 : distance;
  const c = wallsCenterXY();
  const az = (Math.PI / 180) * compassAzimuthDeg;
  const el = (Math.PI / 180) * elevationDeg;
  const dx = distance * Math.cos(el) * Math.sin(az);
  const dy = distance * Math.cos(el) * Math.cos(az);
  const dz = distance * Math.sin(el);
  camera.position.set(c.x + dx, c.y + dy, WALL_HEIGHT_M * 0.3 + dz);
  controls.target.set(c.x, c.y, WALL_HEIGHT_M * 0.3);
}

function viewTop() {
  const c = wallsCenterXY();
  camera.position.set(c.x, c.y, 70);
  controls.target.set(c.x, c.y, 0);
}

// Viste dall'interno: camera in coordinate locali dell'edificio
// (u lungo la navata dalla facciata, v verso Ovest, w in alto), cosi'

// -----------------------------------------------------------------
// Camminare: frecce della tastiera (e croce di frecce sul telefono)
//   su/giu = avanti/indietro nella direzione in cui si guarda
//   sinistra/destra = girarsi; con Maiusc = passo di lato
// La camera e il punto guardato si muovono insieme (i controlli del
// mouse restano validi). Velocita' in m/s e gradi/s.
// -----------------------------------------------------------------
const PASSO_M_S = 3.0, GIRO_GRADI_S = 70, SALITA_M_S = 2.0, QUOTA_MIN_M = 0.3, QUOTA_MAX_M = 40;
const tastiPremuti = new Set();
let maiuscPremuto = false;
const TASTI_CAMMINO = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "PageUp", "PageDown"];
window.addEventListener("keydown", (e) => {
  if (!TASTI_CAMMINO.includes(e.key)) return;
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "SELECT") return;
  e.preventDefault(); tastiPremuti.add(e.key); maiuscPremuto = e.shiftKey;
});
window.addEventListener("keyup", (e) => { tastiPremuti.delete(e.key); maiuscPremuto = e.shiftKey; });
window.addEventListener("blur", () => tastiPremuti.clear());
const ETICHETTE_FRECCE = LANG === "fr"
  ? { ArrowUp: "avancer", ArrowDown: "reculer", ArrowLeft: "tourner à gauche", ArrowRight: "tourner à droite",
      PageUp: "monter", PageDown: "descendre" }
  : { ArrowUp: "avanti", ArrowDown: "indietro", ArrowLeft: "gira a sinistra", ArrowRight: "gira a destra",
      PageUp: "sali", PageDown: "scendi" };
document.querySelector("#frecce .alto").textContent = LANG === "fr" ? "Haut" : "Su";
document.querySelector("#frecce .basso").textContent = LANG === "fr" ? "Bas" : "Giù";
for (const b of document.querySelectorAll("#frecce button")) {
  b.setAttribute("aria-label", ETICHETTE_FRECCE[b.dataset.tasto]);
  const giu = (e) => { e.preventDefault(); b.setPointerCapture?.(e.pointerId); tastiPremuti.add(b.dataset.tasto); b.classList.add("premuto"); };
  const su = (e) => { e.preventDefault(); tastiPremuti.delete(b.dataset.tasto); b.classList.remove("premuto"); };
  b.addEventListener("pointerdown", giu);
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) b.addEventListener(ev, su);
  b.addEventListener("contextmenu", (e) => e.preventDefault());
}
let tempoPrima = performance.now();
function cammina() {
  const ora = performance.now(), dt = Math.min(0.05, (ora - tempoPrima) / 1000);
  tempoPrima = ora;
  if (!tastiPremuti.size) return;
  const pos = camera.position, tgt = controls.target;
  const dir = new THREE.Vector3(tgt.x - pos.x, tgt.y - pos.y, 0);
  if (dir.lengthSq() < 1e-6) dir.set(1, 0, 0);
  dir.normalize();
  const lato = new THREE.Vector3(dir.y, -dir.x, 0);  // a destra di chi guarda
  const mossa = new THREE.Vector3();
  if (tastiPremuti.has("ArrowUp")) mossa.add(dir);
  if (tastiPremuti.has("ArrowDown")) mossa.sub(dir);
  const giro = (tastiPremuti.has("ArrowLeft") ? 1 : 0) - (tastiPremuti.has("ArrowRight") ? 1 : 0);
  if (maiuscPremuto && giro) mossa.addScaledVector(lato, -giro);
  if (mossa.lengthSq()) {
    mossa.normalize().multiplyScalar(PASSO_M_S * dt);
    pos.add(mossa); tgt.add(mossa);
  }
  // su/giu in verticale (PagSu/PagGiu, pulsanti con le frecce doppie)
  const sale = (tastiPremuti.has("PageUp") ? 1 : 0) - (tastiPremuti.has("PageDown") ? 1 : 0);
  if (sale) {
    const dz = Math.min(QUOTA_MAX_M, Math.max(QUOTA_MIN_M, pos.z + sale * SALITA_M_S * dt)) - pos.z;
    pos.z += dz; tgt.z += dz;
  }
  if (giro && !maiuscPremuto) {
    const a = THREE.MathUtils.degToRad(GIRO_GRADI_S * dt * giro);
    const dx = tgt.x - pos.x, dy = tgt.y - pos.y;
    tgt.x = pos.x + dx * Math.cos(a) - dy * Math.sin(a);
    tgt.y = pos.y + dx * Math.sin(a) + dy * Math.cos(a);
  }
}

// -----------------------------------------------------------------
// Luce diretta nel giorno scelto: stessa griglia di 10 minuti di
// mods/jausiers/scripts/sole.py (il blocco 2 del mod)
// -----------------------------------------------------------------
function luceDelGiorno(year, month, day, passoMin = 10) {
  const per = {};
  let alba = null, tramonto = null, culmine = { alt: -99 };
  for (let m = 0; m < 1440; m += passoMin) {
    const ora = m / 60;
    const sun = solarPosition(parisLocalToUTC(year, month, day, ora), LATITUDE_DEG, LONGITUDE_DEG);
    if (!sun.isUp) continue;
    const hhmm = String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
    alba = alba || hhmm;
    tramonto = hhmm;
    if (sun.altitudeDeg > culmine.alt) culmine = { ora: hhmm, alt: sun.altitudeDeg };
    for (const win of church.windows) {
      if (win.group === "porta") continue;
      if (projectWindowWithWalls(church, win.localOutline(), win.wallAzimuthDeg, sun, WALL_HEIGHT_M).length > 0) {
        (per[win.name] = per[win.name] || []).push(hhmm);
      }
    }
  }
  const vetrate = Object.entries(per)
    .map(([n, t]) => ({ nome: n, da: t[0], a: t[t.length - 1], minuti: t.length * passoMin, orari: t }))
    .sort((x, y) => (x.da < y.da ? -1 : x.da > y.da ? 1 : 0));
  return { alba, tramonto, culmine, vetrate };
}

let timerGiorno = null;
function pianificaGiorno() {
  clearTimeout(timerGiorno);
  timerGiorno = setTimeout(mostraGiorno, 200);
}
function mostraGiorno() {
  const { year, month, day } = currentDate();
  const g = luceDelGiorno(year, month, day);
  const esc = (x) => String(x).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  // ogni campione vale i 10 minuti che lo seguono: "07:50–08:10" = 20 min.
  // Se la luce si interrompe e riprende, i tratti sono mostrati separati.
  const minDi = (h) => +h.slice(0, 2) * 60 + +h.slice(3);
  const hhmm = (m) => String(Math.floor(m / 60) % 24).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
  const durata = (m) => (m >= 60 ? Math.floor(m / 60) + " h" + (m % 60 ? " " + String(m % 60).padStart(2, "0") : "") : m + " min");
  const righe = g.vetrate.map((v) => {
    const tratti = [];
    for (const h of v.orari) {
      const m = minDi(h), ultimo = tratti[tratti.length - 1];
      if (ultimo && m === ultimo[1]) ultimo[1] = m + 10; else tratti.push([m, m + 10]);
    }
    const quando = tratti.map(([a, b]) => `${hhmm(a)}–${hhmm(b)}`).join(", ");
    return `<div><span class="t">${quando}</span> ${esc(nome(v.nome))} <span style="color:#8892a0">· ${durata(v.minuti)}</span></div>`;
  });
  document.getElementById("giorno-luce").innerHTML =
    `<div style="color:#8892a0">${T.alba} ${g.alba || "—"} · ${T.tramonto} ${g.tramonto || "—"} · ${T.culmine} ${g.culmine.ora || "—"} (${g.culmine.alt.toFixed(1)}°)</div>` +
    (righe.length ? righe.join("") : `<div>${T.nessuna}</div>`) +
    `<div style="color:#8892a0;font-size:11px;margin-top:6px;line-height:1.35">${T.notaLuce}</div>`;
}
window.luceDelGiorno = luceDelGiorno; // per la verifica contro il Python

resize();
centerCamera();
updateScene();
mostraGiorno();
document.getElementById("loading").style.display = "none";
clearTimeout(window.__loadWatchdog);

function animate() {
  requestAnimationFrame(animate);
  cammina();
  controls.update();
  aggiornaDentroFuori();
  renderer.render(scene, camera);
}
animate();
</script>
